[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "gemma-chess-sft"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["python-chess>=1.999", "tqdm>=4.66", "PyYAML>=6.0"]
[project.optional-dependencies]
train = ["transformers>=4.50", "datasets>=3.0", "torch", "accelerate", "trl", "peft", "sentencepiece"]
dev = ["pytest>=8.0", "ruff>=0.6"]
[tool.ruff]
line-length = 100
