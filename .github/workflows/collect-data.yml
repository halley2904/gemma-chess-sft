name: Collect Lichess SFT pilot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/collect-data.yml"
      - "scripts/collect_lichess_sft.py"
      - "scripts/validate_sft.py"
      - "data/sources.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install data tooling
        run: python -m pip install --upgrade pip python-chess zstandard

      - name: Download small Lichess archive
        run: |
          curl --fail --location --retry 4 --retry-delay 3 \
            "https://database.lichess.org/standard/lichess_db_standard_rated_2014-01.pgn.zst" \
            --output /tmp/lichess_db_standard_rated_2014-01.pgn.zst
          ls -lh /tmp/lichess_db_standard_rated_2014-01.pgn.zst

      - name: Build SFT dataset
        run: |
          python scripts/collect_lichess_sft.py \
            --pgn-zst /tmp/lichess_db_standard_rated_2014-01.pgn.zst \
            --out data/processed/lichess_2014_01_pilot.jsonl.gz \
            --max-games 1000 \
            --min-elo 1800 \
            --min-base-seconds 180 \
            --max-plies-per-game 120 \
            --seed 20261119

      - name: Validate SFT dataset
        run: |
          python scripts/validate_sft.py --input data/processed/lichess_2014_01_pilot.jsonl.gz
          cat data/processed/manifest.json
          cat data/processed/lichess_2014_01_pilot.jsonl.gz.summary.json
          SIZE=$(stat -c%s data/processed/lichess_2014_01_pilot.jsonl.gz)
          echo "Compressed dataset size: $SIZE bytes"
          test "$SIZE" -lt 90000000

      - name: Commit processed pilot to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/processed/lichess_2014_01_pilot.jsonl.gz
          git add -f data/processed/manifest.json
          git add -f data/processed/lichess_2014_01_pilot.jsonl.gz.summary.json
          if git diff --cached --quiet; then
            echo "No dataset changes to commit."
          else
            git commit -m "data: add Lichess human-move SFT pilot"
            git push
          fi
